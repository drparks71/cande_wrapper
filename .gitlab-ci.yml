stages:
  - build
  - publish
  - deploy
  - security

# Only run pipelines on tags, schedules, and default-branch pushes
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Security/evidence jobs — vendored from the (private) Dane/compliance-evidence
# repo's ci/security.gitlab-ci.yml; vendored rather than include:project so fork
# MR pipelines still compile. Scan output publishes to the private evidence repo,
# never to this repository. Runners here are tag-selected, so every security job
# gets a tags override below.
include:
  - local: .gitlab/security.gitlab-ci.yml

sec:sbom:
  tags: [docker]
sec:sca:
  tags: [docker]
sec:pip-audit:
  tags: [docker]
sec:sast:
  tags: [docker]
sec:trivy:
  tags: [docker]
evidence:publish:
  tags: [docker]

# The proprietary CANDE engine source is never tracked in this repo — CI
# fetches it from the private Dane/cande-engine-source project (job-token
# allowlisted there) into the gitignored "CANDE Source/" dir meson expects.
# The sdist stays clean: meson-python packs tracked files only.
.fetch_engine_source: &fetch_engine_source
  - rm -rf "CANDE Source"
  - git clone --depth 1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/Dane/cande-engine-source.git" "CANDE Source"

# Build Linux wheels directly in manylinux containers
.build_linux_wheel:
  stage: build
  tags:
    - docker
  image: quay.io/pypa/manylinux_2_28_x86_64
  before_script: *fetch_engine_source
  script:
    - yum install -y gcc-gfortran
    - PYTHON="/opt/python/${PYTHON_TAG}/bin/python"
    - $PYTHON -m pip install "numpy>=1.26" meson meson-python ninja build
    - $PYTHON -m build --wheel --outdir wheelhouse/
    - auditwheel repair wheelhouse/*.whl -w dist/
  artifacts:
    paths:
      - dist/*.whl

build_linux_cp310:
  extends: .build_linux_wheel
  variables:
    PYTHON_TAG: "cp310-cp310"

build_linux_cp311:
  extends: .build_linux_wheel
  variables:
    PYTHON_TAG: "cp311-cp311"

build_linux_cp312:
  extends: .build_linux_wheel
  variables:
    PYTHON_TAG: "cp312-cp312"

build_linux_cp313:
  extends: .build_linux_wheel
  variables:
    PYTHON_TAG: "cp313-cp313"

# Build Windows wheels using a matrix
build_windows:
  stage: build
  tags:
    - windows
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13"]
  before_script:
    - 'if (Test-Path "CANDE Source") { Remove-Item -Recurse -Force "CANDE Source" }'
    - 'git clone --depth 1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@$env:CI_SERVER_HOST/Dane/cande-engine-source.git" "CANDE Source"'
  script:
    # Locate Python by install path (e.g. C:\Python310\python.exe)
    - $PY_SHORT = "$PYTHON_VERSION" -replace '\.', ''
    - $PYTHON = "C:\Python" + $PY_SHORT + "\python.exe"
    - '& $PYTHON -m pip install "numpy>=1.26" meson meson-python ninja build delvewheel'
    - '& $PYTHON -m build --wheel --outdir wheelhouse/'
    - $wheel = Get-ChildItem wheelhouse\*.whl | Select-Object -First 1
    - '& $PYTHON -m delvewheel repair $wheel.FullName -w dist/'
  artifacts:
    paths:
      - dist/*.whl

# Build source distribution (needs gfortran for meson setup; the engine
# clone is build-scaffolding only — meson-python's git-archive semantics
# keep untracked "CANDE Source/" OUT of the packed sdist)
build_sdist:
  stage: build
  tags:
    - docker
  image: quay.io/pypa/manylinux_2_28_x86_64
  before_script: *fetch_engine_source
  script:
    - yum install -y gcc-gfortran
    - /opt/python/cp310-cp310/bin/python -m pip install build meson-python meson ninja numpy
    - /opt/python/cp310-cp310/bin/python -m build --sdist --outdir dist/
  artifacts:
    paths:
      - dist/*.tar.gz

# Publish to PyPI on tagged releases
publish_pypi:
  stage: publish
  tags:
    - docker
  image: python:3.10
  needs:
    - build_linux_cp310
    - build_linux_cp311
    - build_linux_cp312
    - build_linux_cp313
    - build_windows
    - build_sdist
  script:
    - pip install twine
    - twine upload dist/*
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

# Deploy Sphinx docs to GitLab Pages
pages:
  stage: deploy
  image: python:3.11
  script:
    - pip install -r docs/requirements.txt
    - PYTHONPATH=src python -m sphinx docs public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
